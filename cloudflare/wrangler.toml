# qthe-cell — the qthe kernel live on Cloudflare
# See docs/CLOUDFLARE-DEPLOYMENT.md for the design; PROVENANCE.txt for the
# kernel's byte-identity receipt. LAYER 2: every claim here is measured by
# the /abtest, /twins/:slot and /receipt/:key routes.

name = "qthe-cell"
main = "src/worker.js"
compatibility_date = "2026-10-01"
account_id = "049ff5e84ecf636b53b162cbb580aae6"

# The determinism law at runtime: one substrate per DO id, single-threaded,
# ticks applied exactly-once in order.
[[durable_objects.bindings]]
name = "QTHE_FIELD"
class_name = "QtheField"

# ORCH-R20 (T11-b) — the second live consumer: the task-arbitration docket
# (the E-Q19 tiled law; C10 priced DEAD, ships with the honest label).
[[durable_objects.bindings]]
name = "QTHE_DOCKET"
class_name = "QtheDocket"

# Free-tier-compatible storage class (SQLite-backed DO).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["QtheField"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["QtheDocket"]

# C6 — the wormhole twin sidecar.
[[vectorize]]
binding = "QTHE_TWINS"
index_name = "qthe-twins"

# C7 — the sealed receipt chains, content-addressed.
[[r2_buckets]]
binding = "QTHE_RECEIPTS"
bucket_name = "qthe-receipts"

[observability]
enabled = true

# T8-a — the C6 experiment index (histogram vectors, dedicated; the
# slot sidecar stays in qthe-twins).
[[vectorize]]
binding = "QTHE_C6"
index_name = "qthe-c6"

# T8-b — the KV HUD (the r15 design's HUD, now with its second consumer:
# the cron) and the 5-minute beat (the tminus-dispatcher convergence).
[[kv_namespaces]]
binding = "QTHE_HUD"
id = "025bbc429d4e4c40afad92cfb1cbb689"

[triggers]
crons = ["*/5 * * * *"]
